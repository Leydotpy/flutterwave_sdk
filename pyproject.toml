[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flutterwave-sdk"
version = "0.1.0"
description = "Typed Python SDK for Flutterwave v4"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["cryptography>=43.0", "httpx>=0.28.1", "simplejson>=3.20"]

[project.optional-dependencies]
test = ["pytest>=8.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flutterwave_sdk = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
